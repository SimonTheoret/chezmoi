# tmux port of ~/.config/zellij/config.kdl (requires tmux >= 3.2)
#
# Zellij modes are emulated with key tables. The root table plays the role of
# zellij's "locked" mode (default_mode "locked"); Alt-a enters "normal", from
# which p/t/r/m/s/o enter pane/tab/resize/move/scroll/session. Sticky modes
# re-enter their own table after each action. Any key not bound in a mode
# (Esc, Enter, ...) drops back to root, like zellij's Esc/Enter -> locked.
# Alt shortcuts shared with locked mode are only bound in root, so using them
# from normal mode also returns to locked.

# ----------------------------------------------------------------- options

set -g default-terminal "tmux-256color"
set -as terminal-features "*:RGB"
set -s escape-time 10
set -s extended-keys on                     # support_kitty_keyboard_protocol
set -as terminal-features "xterm*:extkeys"
set -g focus-events on
set -g mouse on
set -g history-limit 10000                  # scroll_buffer_size
set -g set-clipboard on                     # copy through OSC 52
set -g mode-keys vi
set -g base-index 1                         # zellij tabs start at 1
setw -g pane-base-index 1
set -g renumber-windows on

# keybinds clear-defaults=true
set -g prefix None
unbind -a -T prefix

# ----------------------------------------------------- theme "gruvbox-dark"

# compact-bar: session, mode, tabs
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#a89984,bg=#3c3836"
set -g status-left-length 40
set -g status-left "#[fg=#282828,bg=#a89984,bold] #S #[default]#{?pane_in_mode,#[fg=#282828]#[bg=#83a598] scroll ,#{?#{==:#{client_key_table},root}, locked ,#[fg=#282828]#[bg=#fe8019] #{client_key_table} }}#[default] "
set -g status-right ""
set -g window-status-separator ""
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#282828,bg=#d79921,bold] #I #W#{?window_zoomed_flag, (FULLSCREEN),}#{?pane_synchronized, (SYNC),} "

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#504945"
set -g message-style "fg=#fabd2f,bg=#3c3836"
set -g mode-style "fg=#ebdbb2,bg=#504945"
set -g popup-border-style "fg=#a89984"
set -g popup-border-lines rounded

# ------------------------------------------------------ locked (root table)

bind -n M-a switch-client -T normal
bind -n M-f resize-pane -Z
bind -n M-h if -F "#{pane_at_left}" previous-window "select-pane -L"
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l if -F "#{pane_at_right}" next-window "select-pane -R"
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Floating panes live in a "float" session shown in a popup; toggling from
# inside the popup detaches it.
bind -n M-v if -F "#{==:#{session_name},float}" detach-client {
  display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "env -u TMUX tmux new-session -A -s float \\; set status off"
}

# ------------------------------------------------------------------ normal

bind -T normal M-a switch-client -T root
bind -T normal C-q kill-session
bind -T normal p switch-client -T pane
bind -T normal t switch-client -T tab
bind -T normal r switch-client -T resize
bind -T normal m switch-client -T move
bind -T normal s copy-mode
bind -T normal o switch-client -T session
bind -T normal : command-prompt              # tmux only: no prefix table left

bind -T normal M-Left  if -F "#{pane_at_left}" previous-window "select-pane -L" \; switch-client -T normal
bind -T normal M-Down  select-pane -D \; switch-client -T normal
bind -T normal M-Up    select-pane -U \; switch-client -T normal
bind -T normal M-Right if -F "#{pane_at_right}" next-window "select-pane -R" \; switch-client -T normal
bind -T normal M-[ previous-layout \; switch-client -T normal
bind -T normal M-] next-layout \; switch-client -T normal
bind -T normal M-n split-window -h -c "#{pane_current_path}" \; switch-client -T normal

# -------------------------------------------------------------------- pane

bind -T pane M-a switch-client -T root
bind -T pane C-q kill-session
bind -T pane p switch-client -T normal
bind -T pane t switch-client -T tab
bind -T pane m switch-client -T move
bind -T pane s copy-mode
bind -T pane o switch-client -T session

bind -T pane h     select-pane -L \; switch-client -T pane
bind -T pane j     select-pane -D \; switch-client -T pane
bind -T pane k     select-pane -U \; switch-client -T pane
bind -T pane l     select-pane -R \; switch-client -T pane
bind -T pane Left  select-pane -L \; switch-client -T pane
bind -T pane Down  select-pane -D \; switch-client -T pane
bind -T pane Up    select-pane -U \; switch-client -T pane
bind -T pane Right select-pane -R \; switch-client -T pane
bind -T pane Tab   select-pane -t :.+ \; switch-client -T pane

bind -T pane c command-prompt -p "pane name:" -I "#{pane_title}" { select-pane -T "%%" }
bind -T pane d split-window -v -c "#{pane_current_path}"
bind -T pane r split-window -h -c "#{pane_current_path}"
# NewPane: split along the longest side (cells are about twice as tall as wide)
bind -T pane n if -F "#{e|>:#{pane_width},#{e|*:#{pane_height},2}}" {
  split-window -h -c "#{pane_current_path}"
} {
  split-window -v -c "#{pane_current_path}"
}
bind -T pane f resize-pane -Z
bind -T pane w if -F "#{==:#{session_name},float}" detach-client {
  display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "env -u TMUX tmux new-session -A -s float \\; set status off"
}
bind -T pane x kill-pane
# TogglePaneFrames: borders are always drawn, so toggle the title line instead
bind -T pane z if -F "#{==:#{pane-border-status},off}" "set -w pane-border-status top" "set -w pane-border-status off"

# --------------------------------------------------------------------- tab

bind -T tab M-a switch-client -T root
bind -T tab C-q kill-session
bind -T tab t switch-client -T normal
bind -T tab p switch-client -T pane
bind -T tab m switch-client -T move
bind -T tab o switch-client -T session

bind -T tab h     previous-window \; switch-client -T tab
bind -T tab k     previous-window \; switch-client -T tab
bind -T tab Up    previous-window \; switch-client -T tab
bind -T tab j     next-window \; switch-client -T tab
bind -T tab l     next-window \; switch-client -T tab
bind -T tab Down  next-window \; switch-client -T tab
bind -T tab Left  swap-window -d -t -1 \; switch-client -T tab
bind -T tab Right swap-window -d -t +1 \; switch-client -T tab
bind -T tab Tab   last-window \; switch-client -T tab

bind -T tab 1 select-window -t :1
bind -T tab 2 select-window -t :2
bind -T tab 3 select-window -t :3
bind -T tab 4 select-window -t :4
bind -T tab 5 select-window -t :5
bind -T tab 6 select-window -t :6
bind -T tab 7 select-window -t :7
bind -T tab 8 select-window -t :8
bind -T tab 9 select-window -t :9

# BreakPaneLeft/Right: move the pane into the neighbouring tab, or a new one at the edge
bind -T tab [ if -F "#{window_start_flag}" "break-pane -b" "join-pane -t :-"
bind -T tab ] if -F "#{window_end_flag}" "break-pane -a" "join-pane -t :+"
bind -T tab b break-pane
bind -T tab n new-window -c "#{pane_current_path}"
bind -T tab r command-prompt -p "tab name:" -I "#W" { rename-window -- "%%" }
bind -T tab s setw synchronize-panes
bind -T tab x kill-window

# ------------------------------------------------------------------ resize
# tmux moves the shared border rather than growing a given edge, so zellij's
# "Decrease" (HJKL) and +/-/= resizes have no equivalent.

bind -T resize M-a switch-client -T root
bind -T resize C-q kill-session
bind -T resize r switch-client -T normal
bind -T resize p switch-client -T pane
bind -T resize t switch-client -T tab
bind -T resize m switch-client -T move
bind -T resize s copy-mode
bind -T resize o switch-client -T session

bind -T resize h     resize-pane -L 5 \; switch-client -T resize
bind -T resize j     resize-pane -D 5 \; switch-client -T resize
bind -T resize k     resize-pane -U 5 \; switch-client -T resize
bind -T resize l     resize-pane -R 5 \; switch-client -T resize
bind -T resize Left  resize-pane -L 5 \; switch-client -T resize
bind -T resize Down  resize-pane -D 5 \; switch-client -T resize
bind -T resize Up    resize-pane -U 5 \; switch-client -T resize
bind -T resize Right resize-pane -R 5 \; switch-client -T resize

# -------------------------------------------------------------------- move

bind -T move M-a switch-client -T root
bind -T move C-q kill-session
bind -T move m switch-client -T normal
bind -T move t switch-client -T tab
bind -T move s copy-mode
bind -T move o switch-client -T session
bind -T move r switch-client -T resize

bind -T move h     swap-pane -s "{left-of}" \; switch-client -T move
bind -T move j     swap-pane -s "{down-of}" \; switch-client -T move
bind -T move k     swap-pane -s "{up-of}" \; switch-client -T move
bind -T move l     swap-pane -s "{right-of}" \; switch-client -T move
bind -T move Left  swap-pane -s "{left-of}" \; switch-client -T move
bind -T move Down  swap-pane -s "{down-of}" \; switch-client -T move
bind -T move Up    swap-pane -s "{up-of}" \; switch-client -T move
bind -T move Right swap-pane -s "{right-of}" \; switch-client -T move
bind -T move n     swap-pane -D \; switch-client -T move
bind -T move Tab   swap-pane -D \; switch-client -T move
bind -T move p     swap-pane -U \; switch-client -T move

# ----------------------------------------------------------------- session

bind -T session M-a switch-client -T root
bind -T session C-q kill-session
bind -T session o switch-client -T normal
bind -T session t switch-client -T tab
bind -T session s copy-mode
bind -T session m switch-client -T move
bind -T session r switch-client -T resize

bind -T session c source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind -T session d detach-client
bind -T session w choose-tree -Zs

# ---------------------------------------------------- scroll (copy-mode-vi)
# Keeps vi cursor motions (h/j/k/l, ...) so text can be selected; C-b/C-f,
# PageUp/PageDown, C-c and n come from the tmux defaults.

bind -T copy-mode-vi M-a send -X cancel
bind -T copy-mode-vi s send -X cancel
bind -T copy-mode-vi Escape if -F "#{selection_present}" "send -X clear-selection" "send -X cancel"
bind -T copy-mode-vi d send -X halfpage-down
bind -T copy-mode-vi u send -X halfpage-up
bind -T copy-mode-vi f command-prompt -T search -p "(search up)" { send -X search-backward "%%" }
bind -T copy-mode-vi p send -X search-reverse
bind -T copy-mode-vi e {
  send -X cancel
  capture-pane -J -S -
  save-buffer /tmp/tmux-scrollback.txt
  delete-buffer
  display-popup -E -w 100% -h 100% '$EDITOR /tmp/tmux-scrollback.txt'
}
