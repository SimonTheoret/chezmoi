# tmux port of zellij/config.kdl
#
# Zellij's modes are emulated with key tables. The root table is zellij's
# "locked" mode: only Alt bindings are active. Alt a enters "normal", from
# which p/t/r/m/s/o enter pane/tab/resize/move/scroll/session. A key table
# only lasts for one key, so bindings that should stay in their mode start
# with `switch-client -T <mode>`. Esc, Enter or Alt a return to locked.

# Options {{{1

# No prefix key: Alt a is the entry point, like zellij (clear-defaults=true)
set -g prefix None
unbind C-b

set -g default-terminal "tmux-256color"
# fish exports TERM=xterm, so tell tmux what the terminal really supports
set -as terminal-features ",xterm*:256:RGB:extkeys"
set -as terminal-features ",alacritty*:256:RGB:extkeys"
set -as terminal-features ",xterm-kitty:256:RGB:extkeys"
# support_kitty_keyboard_protocol
set -s extended-keys on
set -s escape-time 10
set -s focus-events on
# Copy with OSC 52 (zellij default when copy_command is unset)
set -s set-clipboard on

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#S | #T"
# Image previews in yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# pane_frames false
setw -g pane-border-status off
setw -g pane-border-format " #P #{pane_title} "
setw -g pane-border-lines single

# Theme: gruvbox-dark, compact bar, simplified_ui {{{1

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#282828,fg=#d5c4a1"
set -g status-left-length 40
set -g status-left "#{?#{==:#{pane_mode},copy-mode},#[bg=#d79921#,fg=#282828#,bold] scroll ,#{?#{==:#{client_key_table},root},#[bg=#3c3836#,fg=#a89984] locked ,#[bg=#98971a#,fg=#282828#,bold] #{client_key_table} }}#[default] #S "
set -g status-right ""
setw -g window-status-separator " "
setw -g window-status-format "#[bg=#3c3836,fg=#a89984] #I #W#{?window_zoomed_flag, (fullscreen),}#{?pane_synchronized, (sync),} "
setw -g window-status-current-format "#[bg=#98971a,fg=#282828,bold] #I #W#{?window_zoomed_flag, (fullscreen),}#{?pane_synchronized, (sync),} "

setw -g pane-border-style "fg=#3c3836"
setw -g pane-active-border-style "fg=#98971a"
set -g popup-border-style "fg=#98971a"
set -g popup-border-lines rounded
set -g menu-style "bg=#282828,fg=#d5c4a1"
set -g menu-selected-style "bg=#98971a,fg=#282828"
set -g menu-border-style "fg=#504945"
set -g message-style "bg=#3c3836,fg=#fabd2f"
setw -g mode-style "bg=#504945,fg=#fbf1c7"

# Floating scratch session (ToggleFloatingPanes) {{{1

# tmux floating panes can't be hidden, so Alt v toggles a popup attached to a
# per-session "_float-<session>" session instead.
set-hook -g session-created 'if -F "#{m:_float-*,#{session_name}}" "set status off"'

# Locked (root table) {{{1

bind -n M-a switch-client -T normal

bind -n M-f resize-pane -Z
bind -n M-h if -F "#{pane_at_left}" previous-window "select-pane -L"
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l if -F "#{pane_at_right}" next-window "select-pane -R"
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-v if -F "#{m:_float-*,#{session_name}}" detach-client {
    run-shell -C 'display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "env -u TMUX tmux new-session -A -s _float-#{session_name}"'
}

# Normal {{{1

bind -T normal M-a switch-client -T root
bind -T normal Escape switch-client -T root
bind -T normal Enter switch-client -T root
bind -T normal C-q confirm-before -p "kill session #S? (y/n)" kill-session
bind -T normal p switch-client -T pane
bind -T normal t switch-client -T tab
bind -T normal r switch-client -T resize
bind -T normal m switch-client -T move
bind -T normal s copy-mode
bind -T normal o switch-client -T session
bind -T normal : command-prompt
bind -T normal R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind -T normal M-Left switch-client -T normal \; if -F "#{pane_at_left}" previous-window "select-pane -L"
bind -T normal M-Down switch-client -T normal \; select-pane -D
bind -T normal M-Up switch-client -T normal \; select-pane -U
bind -T normal M-Right switch-client -T normal \; if -F "#{pane_at_right}" next-window "select-pane -R"
bind -T normal M-h switch-client -T normal \; if -F "#{pane_at_left}" previous-window "select-pane -L"
bind -T normal M-j switch-client -T normal \; select-pane -D
bind -T normal M-k switch-client -T normal \; select-pane -U
bind -T normal M-l switch-client -T normal \; if -F "#{pane_at_right}" next-window "select-pane -R"
bind -T normal M-1 switch-client -T normal \; select-window -t :1
bind -T normal M-2 switch-client -T normal \; select-window -t :2
bind -T normal M-3 switch-client -T normal \; select-window -t :3
bind -T normal M-4 switch-client -T normal \; select-window -t :4
bind -T normal M-5 switch-client -T normal \; select-window -t :5
bind -T normal M-6 switch-client -T normal \; select-window -t :6
bind -T normal M-7 switch-client -T normal \; select-window -t :7
bind -T normal M-8 switch-client -T normal \; select-window -t :8
bind -T normal M-9 switch-client -T normal \; select-window -t :9
# Resize "Increase"/"Decrease": grow or shrink away from the window edges
bind -T normal M-+ switch-client -T normal \; \
    if -F "#{pane_at_right}" "resize-pane -L 5" "resize-pane -R 5" \; \
    if -F "#{pane_at_bottom}" "resize-pane -U 2" "resize-pane -D 2"
bind -T normal M-= switch-client -T normal \; \
    if -F "#{pane_at_right}" "resize-pane -L 5" "resize-pane -R 5" \; \
    if -F "#{pane_at_bottom}" "resize-pane -U 2" "resize-pane -D 2"
bind -T normal M-- switch-client -T normal \; \
    if -F "#{pane_at_right}" "resize-pane -R 5" "resize-pane -L 5" \; \
    if -F "#{pane_at_bottom}" "resize-pane -D 2" "resize-pane -U 2"
# Swap layouts
bind -T normal M-[ switch-client -T normal \; previous-layout
bind -T normal M-] switch-client -T normal \; next-layout
bind -T normal M-n split-window -h -c "#{pane_current_path}"

# Pane {{{1

bind -T pane M-a switch-client -T root
bind -T pane Escape switch-client -T root
bind -T pane Enter switch-client -T root
bind -T pane C-q confirm-before -p "kill session #S? (y/n)" kill-session
bind -T pane p switch-client -T normal
bind -T pane t switch-client -T tab
bind -T pane m switch-client -T move
bind -T pane s copy-mode
bind -T pane o switch-client -T session

bind -T pane Left switch-client -T pane \; select-pane -L
bind -T pane Down switch-client -T pane \; select-pane -D
bind -T pane Up switch-client -T pane \; select-pane -U
bind -T pane Right switch-client -T pane \; select-pane -R
bind -T pane h switch-client -T pane \; select-pane -L
bind -T pane j switch-client -T pane \; select-pane -D
bind -T pane k switch-client -T pane \; select-pane -U
bind -T pane l switch-client -T pane \; select-pane -R
bind -T pane Tab switch-client -T pane \; select-pane -t :.+
bind -T pane c command-prompt -I "#T" -p "pane name:" { select-pane -T "%%" }
bind -T pane d split-window -v -c "#{pane_current_path}"
bind -T pane r split-window -h -c "#{pane_current_path}"
# NewPane: split along the longest side (cells are about twice as tall as wide)
bind -T pane n if -F "#{e|>:#{pane_width},#{e|*:#{pane_height},2}}" \
    'split-window -h -c "#{pane_current_path}"' \
    'split-window -v -c "#{pane_current_path}"'
bind -T pane e if -F "#{pane_floating_flag}" join-pane "break-pane -W"
bind -T pane f resize-pane -Z
bind -T pane w send-keys -K M-v
bind -T pane x kill-pane
bind -T pane z if -F "#{==:#{pane-border-status},off}" \
    "setw pane-border-status top" "setw pane-border-status off"

# Tab {{{1

bind -T tab M-a switch-client -T root
bind -T tab Escape switch-client -T root
bind -T tab Enter switch-client -T root
bind -T tab C-q confirm-before -p "kill session #S? (y/n)" kill-session
bind -T tab t switch-client -T normal
bind -T tab p switch-client -T pane
bind -T tab m switch-client -T move
bind -T tab o switch-client -T session

bind -T tab Left switch-client -T tab \; swap-window -d -t -1
bind -T tab Right switch-client -T tab \; swap-window -d -t +1
bind -T tab Down switch-client -T tab \; next-window
bind -T tab Up switch-client -T tab \; previous-window
bind -T tab h switch-client -T tab \; previous-window
bind -T tab j switch-client -T tab \; next-window
bind -T tab k switch-client -T tab \; previous-window
bind -T tab l switch-client -T tab \; next-window
bind -T tab Tab switch-client -T tab \; last-window
bind -T tab 1 select-window -t :1
bind -T tab 2 select-window -t :2
bind -T tab 3 select-window -t :3
bind -T tab 4 select-window -t :4
bind -T tab 5 select-window -t :5
bind -T tab 6 select-window -t :6
bind -T tab 7 select-window -t :7
bind -T tab 8 select-window -t :8
bind -T tab 9 select-window -t :9
# BreakPaneLeft/Right: move the pane to the neighbouring tab, or a new one
bind -T tab [ if -F "#{window_start_flag}" "break-pane -b" "join-pane -h -t :-"
bind -T tab ] if -F "#{window_end_flag}" "break-pane -a" "join-pane -h -t :+"
bind -T tab b break-pane
bind -T tab n new-window -c "#{pane_current_path}"
bind -T tab r command-prompt -I "#W" -p "tab name:" { rename-window -- "%%" }
bind -T tab s setw synchronize-panes
bind -T tab x kill-window

# Resize {{{1

bind -T resize M-a switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -T resize C-q confirm-before -p "kill session #S? (y/n)" kill-session
bind -T resize r switch-client -T normal
bind -T resize p switch-client -T pane
bind -T resize t switch-client -T tab
bind -T resize m switch-client -T move
bind -T resize s copy-mode
bind -T resize o switch-client -T session

# tmux moves the border instead of growing a side, so "Decrease left" (H) is
# the same border move as "Increase right" (l), and so on.
bind -T resize Left switch-client -T resize \; resize-pane -L 5
bind -T resize Down switch-client -T resize \; resize-pane -D 2
bind -T resize Up switch-client -T resize \; resize-pane -U 2
bind -T resize Right switch-client -T resize \; resize-pane -R 5
bind -T resize h switch-client -T resize \; resize-pane -L 5
bind -T resize j switch-client -T resize \; resize-pane -D 2
bind -T resize k switch-client -T resize \; resize-pane -U 2
bind -T resize l switch-client -T resize \; resize-pane -R 5
bind -T resize H switch-client -T resize \; resize-pane -R 5
bind -T resize J switch-client -T resize \; resize-pane -U 2
bind -T resize K switch-client -T resize \; resize-pane -D 2
bind -T resize L switch-client -T resize \; resize-pane -L 5
bind -T resize + switch-client -T resize \; \
    if -F "#{pane_at_right}" "resize-pane -L 5" "resize-pane -R 5" \; \
    if -F "#{pane_at_bottom}" "resize-pane -U 2" "resize-pane -D 2"
bind -T resize = switch-client -T resize \; \
    if -F "#{pane_at_right}" "resize-pane -L 5" "resize-pane -R 5" \; \
    if -F "#{pane_at_bottom}" "resize-pane -U 2" "resize-pane -D 2"
bind -T resize - switch-client -T resize \; \
    if -F "#{pane_at_right}" "resize-pane -R 5" "resize-pane -L 5" \; \
    if -F "#{pane_at_bottom}" "resize-pane -D 2" "resize-pane -U 2"

# Move {{{1

bind -T move M-a switch-client -T root
bind -T move Escape switch-client -T root
bind -T move Enter switch-client -T root
bind -T move C-q confirm-before -p "kill session #S? (y/n)" kill-session
bind -T move m switch-client -T normal
bind -T move t switch-client -T tab
bind -T move r switch-client -T resize
bind -T move s copy-mode
bind -T move o switch-client -T session

bind -T move Left switch-client -T move \; swap-pane -s "{left-of}"
bind -T move Down switch-client -T move \; swap-pane -s "{down-of}"
bind -T move Up switch-client -T move \; swap-pane -s "{up-of}"
bind -T move Right switch-client -T move \; swap-pane -s "{right-of}"
bind -T move h switch-client -T move \; swap-pane -s "{left-of}"
bind -T move j switch-client -T move \; swap-pane -s "{down-of}"
bind -T move k switch-client -T move \; swap-pane -s "{up-of}"
bind -T move l switch-client -T move \; swap-pane -s "{right-of}"
bind -T move n switch-client -T move \; swap-pane -D
bind -T move Tab switch-client -T move \; swap-pane -D
bind -T move p switch-client -T move \; swap-pane -U

# Session {{{1

bind -T session M-a switch-client -T root
bind -T session Escape switch-client -T root
bind -T session Enter switch-client -T root
bind -T session C-q confirm-before -p "kill session #S? (y/n)" kill-session
bind -T session o switch-client -T normal
bind -T session t switch-client -T tab
bind -T session r switch-client -T resize
bind -T session m switch-client -T move
bind -T session s copy-mode

bind -T session c customize-mode -Z
bind -T session d detach-client
bind -T session w choose-tree -Zs -f "#{!:#{m:_float-*,#{session_name}}}"
# Open a layout as new tabs in this session (zellij action new-tab --layout)
bind -T session l display-menu -T " layouts " \
    ed e 'new-window -c "#{pane_current_path}" ; source-file ~/.config/tmux/layouts/ed.conf' \
    v v 'new-window -c "#{pane_current_path}" ; source-file ~/.config/tmux/layouts/v.conf'

# Scroll (copy mode) {{{1

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi d send -X halfpage-down
bind -T copy-mode-vi u send -X halfpage-up
bind -T copy-mode-vi p send -X search-reverse
# EditScrollback
bind -T copy-mode-vi e send -X cancel \; \
    capture-pane -S - -J -b scrollback \; \
    display-popup -E -w 90% -h 90% "~/.config/tmux/scripts/edit-scrollback.sh"

