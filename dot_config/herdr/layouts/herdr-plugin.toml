id = "layouts"
name = "Layouts"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Ports of the zellij ed and v layouts, new workspaces get v"
platforms = ["linux", "macos"]

[[actions]]
id = "ed"
title = "Apply ed layout"
contexts = ["workspace"]
command = ["sh", "layout.sh", "apply", "ed"]

[[actions]]
id = "new-v"
title = "New workspace with v layout"
contexts = ["workspace"]
command = ["sh", "layout.sh", "new", "v"]

[[events]]
on = "workspace.created"
command = ["sh", "layout.sh", "apply", "v"]
