onboarding=false
[theme]
name = "gruvbox"

[[keys.command]]
key = "prefix+alt+g"        # prefix is ctrl+b by default
type = "popup"
command = "lazygit"        # or "fish", "$SHELL", etc.
description = "run lazygit"
width = "80%"               # optional: "80%" or a number of cells
height = "80%"

[ui]
status_indicators = "symbols"
pane_gaps = false

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[worktrees]
directory = "~/worktrees"

[keys]
focus_agent = "prefix+alt+1..9"
open_worktree = "prefix+alt+o"
remove_worktree = "prefix+alt+d"  # opens confirmation, deletes the checkout
navigate_workspace_up = "k"     # navigate mode: swap j/k and arrows
navigate_workspace_down = "j"

[[keys.command]]
key = "prefix+alt+i"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"


[[keys.command]]
key = "prefix+alt+j"
type = "popup"
command = "lazydocker"
description = "run lazydocker"
width = "80%"
height = "80%"

# plugin in ~/.config/herdr/layouts, link once with: herdr plugin link ~/.config/herdr/layouts
[[keys.command]]
key = "prefix+alt+e"
type = "plugin_action"
command = "layouts.ed"
description = "apply ed layout"

[[keys.command]]
key = "prefix+alt+v"
type = "plugin_action"
command = "layouts.new-v"
description = "new workspace with v layout"
